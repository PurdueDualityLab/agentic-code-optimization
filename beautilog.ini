[logger]
name = root
save_to_file = true
log_level = NOTIFICATION
suppress_other_loggers = true
disabled_loggers = []
; disabled_loggers = numpy,matplotlib,urllib3

[file_logger]
log_file_path = beauti-run.log
backup_count = 5
max_bytes = 104857600
log_level = DEBUG

[custom_levels]
NOTIFICATION = 12
LLM_CALL = 15
TOOL_CALL = 14

; [redirected_loggers]
; numpy = DEBUG

[level_colors]
CRITICAL = RED
ERROR = BRIGHT_RED
WARNING = YELLOW
INFO = CYAN
NOTIFICATION = GREEN
LLM_CALL = BLUE
TOOL_CALL = MAGENTA
DEFAULT = RESET