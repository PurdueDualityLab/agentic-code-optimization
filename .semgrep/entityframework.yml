rules:
  - id: ef-dbcontext-class
    patterns:
      - pattern: |
          class $NAME : DbContext { ... }
    message: "Found Entity Framework DbContext: $NAME"
    languages: [csharp]
    severity: INFO
    metadata:
      category: database
      orm: entity-framework

  - id: ef-dbset-property
    patterns:
      - pattern: |
          public DbSet<$ENTITY> $PROP { get; set; }
    message: "Found Entity Framework entity: $ENTITY"
    languages: [csharp]
    severity: INFO
    metadata:
      category: entity
      orm: entity-framework

  - id: ef-connection-string
    patterns:
      - pattern-either:
          - pattern: |
              UseSqlServer($CONN)
          - pattern: |
              UseNpgsql($CONN)
          - pattern: |
              UseMySql($CONN)
          - pattern: |
              UseSqlite($CONN)
    message: "Found database connection configuration"
    languages: [csharp]
    severity: INFO
    metadata:
      category: database-config

  - id: ef-migration
    patterns:
      - pattern: |
          public partial class $NAME : Migration { ... }
    message: "Found Entity Framework migration: $NAME"
    languages: [csharp]
    severity: INFO
    metadata:
      category: migration
