rules:
  - id: csharp-httpclient-usage
    patterns:
      - pattern-either:
          - pattern: |
              new HttpClient()
          - pattern: |
              IHttpClientFactory $FACTORY
          - pattern: |
              CreateClient($NAME)
    message: "Found HttpClient usage"
    languages: [csharp]
    severity: INFO
    metadata:
      category: http-client

  - id: csharp-redis-cache
    patterns:
      - pattern-either:
          - pattern: |
              IDistributedCache $CACHE
          - pattern: |
              AddStackExchangeRedisCache(...)
          - pattern: |
              ConnectionMultiplexer.Connect($CONN)
    message: "Found Redis cache usage"
    languages: [csharp]
    severity: INFO
    metadata:
      category: cache
      type: redis

  - id: csharp-rabbitmq-client
    patterns:
      - pattern-either:
          - pattern: |
              new ConnectionFactory()
          - pattern: |
              IModel $CHANNEL
    message: "Found RabbitMQ usage"
    languages: [csharp]
    severity: INFO
    metadata:
      category: queue
      type: rabbitmq

  - id: csharp-grpc-client
    patterns:
      - pattern: |
          $CLIENT.CallInvoker
    message: "Found gRPC client usage"
    languages: [csharp]
    severity: INFO
    metadata:
      category: grpc
